name: Build and Deploy

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      deployments: write
    uses: chobbledotcom/chobble-client/.github/workflows/shared-build-and-deploy.yml@main
    with:
      template-ref: 9a3d6b3f400018c1589ef9a2bebf56fe930980ce # last v1 commit
    secrets: inherit
